services:
  aletheia-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: aletheia-dedfir:latest
    container_name: aletheia-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WASP_CASES_DIR=/app/run_artifacts
      - PYTHONUNBUFFERED=1
    volumes:
      - ./run_artifacts:/app/run_artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
