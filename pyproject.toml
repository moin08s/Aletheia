[project]
name = "aletheia"
version = "1.5.0"
description = "Aletheia: The Incorruptible Witness on Ethereum - Decentralized Digital Forensics & Incident Response (DeDFIR) platform."
readme = "README.md"
authors = [
    { name = "Aletheia DeDFIR Contributors" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.0",
    "jinja2>=3.1.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[project.scripts]
aletheia = "chronotrace.cli.main:app"
wasp = "chronotrace.cli.main:app"
chronotrace = "chronotrace.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
